<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f5f7fa"/>
  
  <!-- Header -->
  <rect width="800" height="80" fill="#00c8ff"/>
  <circle cx="50" cy="40" r="25" fill="#635bff"/>
  <text x="90" y="50" font-family="Inter, sans-serif" font-size="24" fill="white" font-weight="600">Financial Calculator</text>
  <text x="90" y="68" font-family="Inter, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">Calculate expenses and budgets</text>
  
  <!-- Main calculator area -->
  <rect x="120" y="120" width="560" height="380" fill="white" rx="12"/>
  
  <!-- Display screen -->
  <rect x="160" y="150" width="480" height="70" fill="#1a1a1a" rx="8"/>
  <text x="640" y="195" font-family="monospace" font-size="32" fill="#00d4ff" text-anchor="end" font-weight="600">1,234.56</text>
  
  <!-- Calculation history -->
  <text x="160" y="240" font-family="Inter, sans-serif" font-size="12" fill="#64748b">Recent Calculations:</text>
  <text x="160" y="265" font-family="Inter, sans-serif" font-size="12" fill="#1a1a1a">Salary + Bonus = $2,500.00</text>
  <text x="160" y="290" font-family="Inter, sans-serif" font-size="12" fill="#1a1a1a">Monthly Expenses = $1,265.44</text>
  <text x="160" y="315" font-family="Inter, sans-serif" font-size="12" fill="#1a1a1a">Net Income = $1,234.56</text>
  
  <!-- Calculator buttons -->
  <g id="buttons">
    <!-- Row 1 -->
    <rect x="160" y="350" width="100" height="40" fill="#f1f5f9" rx="6" stroke="#e2e8f0" stroke-width="1"/>
    <text x="210" y="375" font-family="Inter, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600">Clear</text>
    
    <rect x="280" y="350" width="100" height="40" fill="#f1f5f9" rx="6" stroke="#e2e8f0" stroke-width="1"/>
    <text x="330" y="375" font-family="Inter, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600">/</text>
    
    <rect x="400" y="350" width="100" height="40" fill="#f1f5f9" rx="6" stroke="#e2e8f0" stroke-width="1"/>
    <text x="450" y="375" font-family="Inter, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="600">×</text>
    
    <rect x="520" y="350" width="100" height="40" fill="#635bff" rx="6"/>
    <text x="570" y="375" font-family="Inter, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">−</text>
  </g>
  
  <!-- Submit button -->
  <rect x="280" y="410" width="240" height="50" fill="#10b981" rx="6"/>
  <text x="400" y="440" font-family="Inter, sans-serif" font-size="14" fill="white" font-weight="600" text-anchor="middle">Calculate Total</text>
  
  <!-- Footer -->
  <rect y="520" width="800" height="80" fill="#f8fafc"/>
  <text x="40" y="555" font-family="Inter, sans-serif" font-size="12" fill="#475569">© 2024 Maria Garcia. Built with My Best Agent.</text>
</svg>