<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f5f7fa"/>
  
  <!-- Header -->
  <rect width="800" height="80" fill="#4f46e5"/>
  <circle cx="50" cy="40" r="25" fill="#00d4ff"/>
  <text x="90" y="50" font-family="Inter, sans-serif" font-size="24" fill="white" font-weight="600">Jean's Restaurant</text>
  <text x="90" y="68" font-family="Inter, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">Contact us for reservations</text>
  
  <!-- Main form area -->
  <rect x="120" y="120" width="560" height="420" fill="white" rx="12"/>
  
  <!-- Form title -->
  <text x="400" y="160" font-family="Inter, sans-serif" font-size="20" fill="#1a1a1a" font-weight="600" text-anchor="middle">Contact Form</text>
  
  <!-- Form fields -->
  <rect x="160" y="190" width="480" height="45" fill="#f1f5f9" rx="6" stroke="#e2e8f0" stroke-width="1"/>
  <text x="180" y="220" font-family="Inter, sans-serif" font-size="12" fill="#64748b">Your Name</text>
  
  <rect x="160" y="250" width="480" height="45" fill="#f1f5f9" rx="6" stroke="#e2e8f0" stroke-width="1"/>
  <text x="180" y="280" font-family="Inter, sans-serif" font-size="12" fill="#64748b">Email Address</text>
  
  <rect x="160" y="310" width="480" height="45" fill="#f1f5f9" rx="6" stroke="#e2e8f0" stroke-width="1"/>
  <text x="180" y="340" font-family="Inter, sans-serif" font-size="12" fill="#64748b">Date of Visit</text>
  
  <!-- Message field -->
  <rect x="160" y="370" width="480" height="80" fill="#f1f5f9" rx="6" stroke="#e2e8f0" stroke-width="1"/>
  <text x="180" y="395" font-family="Inter, sans-serif" font-size="12" fill="#64748b">Message</text>
  
  <!-- Submit button -->
  <rect x="280" y="470" width="240" height="50" fill="#635bff" rx="6"/>
  <text x="400" y="500" font-family="Inter, sans-serif" font-size="14" fill="white" font-weight="600" text-anchor="middle">Send Message</text>
  
  <!-- Footer -->
  <rect y="520" width="800" height="80" fill="#f8fafc"/>
  <text x="40" y="555" font-family="Inter, sans-serif" font-size="12" fill="#475569">© 2024 Jean Dubois. Built with My Best Agent.</text>
</svg>